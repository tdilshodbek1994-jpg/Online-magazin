name: ci
on:
  push: { branches: ["**"] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6-bookworm
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @om/shared build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Unit tests (shared)
        run: pnpm --filter @om/shared test
      - name: Integration tests on real PostgreSQL (release gate — no skips allowed)
        env: { TEST_PG_ADMIN_URL: "postgres://postgres:postgres@localhost:5432/postgres" }
        run: pnpm --filter @om/api exec vitest run --reporter=default --reporter=junit --outputFile=api-junit.xml
      - name: Web build
        run: pnpm --filter @om/web build
      - name: Dependency audit (high/critical)
        run: pnpm audit --prod --audit-level high
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: apps/api/api-junit.xml }
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 detect --source=/repo --no-banner --redact
